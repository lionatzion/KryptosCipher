[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kryptoscipher-research"
version = "0.2.0"
description = "Reproducible, bounded Kryptos experiments; no K4 solution claim"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24"]
test = ["numpy>=1.24", "jsonschema>=4"]

[project.scripts]
kryptos = "kryptos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kryptos = ["fixtures.json"]
